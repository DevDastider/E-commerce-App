# This workflow builds a Java project with Maven, runs SonarQube analysis, and generates code quality metrics.
# It is triggered on push to master, pull requests to master, and manual workflow dispatch.
# The workflow includes Maven build, SonarQube scan, and metrics collection/reporting.
# Uses SonarQube Developer Edition 10.6.0 which supports code coverage metrics
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven


name: PR_Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:  # Enables manual trigger

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:10.6.0-developer
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl --silent --fail http://localhost:9000 || exit 1"
          --health-interval=30s
          --health-timeout=30s
          --health-retries=10
          --memory=4g
          --cpus=2

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean test package --file pom.xml

    - name: Wait for SonarQube to be ready
      run: |
        echo "Waiting for SonarQube to start..."
        MAX_ATTEMPTS=60
        ATTEMPT=0
        
        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          echo "Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS..."
          
          # Check if SonarQube is responding
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:9000/api/system/status)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          if [ "$HTTP_CODE" = "200" ]; then
            STATUS=$(echo "$BODY" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is up and running!"
              break
            fi
          fi
          
          ATTEMPT=$((ATTEMPT + 1))
          sleep 3
        done
        
        if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
          echo "Warning: SonarQube may not be fully ready, but continuing..."
        fi

    - name: SonarQube Scan
      run: |
        mvn sonar:sonar \
          -Dsonar.projectKey=com.sgd:e-commerce \
          -Dsonar.host.url=http://localhost:9000 \
          -Dsonar.login=admin \
          -Dsonar.password=admin \
          -Dsonar.java.coveragePlugin=jacoco \
          -Dsonar.jacoco.reportPath=target/jacoco.exec \
          -Dsonar.junit.reportPaths=target/surefire-reports

    - name: Fetch SonarQube Metrics
      run: |
        echo "========== SonarQube Code Quality Metrics =========="
        
        # API endpoint and credentials
        SONAR_URL="http://localhost:9000"
        PROJECT_KEY="com.sgd%3Ae-commerce"
        AUTH="-u admin:admin"
        
        # Wait for SonarQube to process the analysis
        echo "Waiting for SonarQube to process the analysis..."
        sleep 20
        
        # Debug: Check if project exists and get details
        echo ""
        echo "--- Project Status ---"
        PROJECT_RESPONSE=$(curl -s $AUTH "$SONAR_URL/api/projects/search?query=e-commerce")
        PROJECT_COUNT=$(echo "$PROJECT_RESPONSE" | jq '.paging.total')
        echo "Projects found: $PROJECT_COUNT"
        
        if [ "$PROJECT_COUNT" -eq 0 ]; then
          echo "ERROR: Project not found in SonarQube!"
          exit 1
        fi
        
        # Get project details
        PROJECT_DETAIL=$(curl -s $AUTH "$SONAR_URL/api/components/show?component=$PROJECT_KEY")
        PROJECT_NAME=$(echo "$PROJECT_DETAIL" | jq -r '.component.name')
        echo "Project: $PROJECT_NAME"
        
        # Fetch coverage metrics
        echo ""
        echo "--- Code Coverage ---"
        COVERAGE_RESPONSE=$(curl -s $AUTH "$SONAR_URL/api/measures/component?metricKeys=coverage,line_coverage,branch_coverage&component=$PROJECT_KEY")
        
        TOTAL_COVERAGE=$(echo "$COVERAGE_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="coverage") | .value // empty' 2>/dev/null | head -1)
        LINE_COVERAGE=$(echo "$COVERAGE_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="line_coverage") | .value // empty' 2>/dev/null | head -1)
        BRANCH_COVERAGE=$(echo "$COVERAGE_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="branch_coverage") | .value // empty' 2>/dev/null | head -1)
        
        [ -z "$TOTAL_COVERAGE" ] && TOTAL_COVERAGE="N/A"
        [ -z "$LINE_COVERAGE" ] && LINE_COVERAGE="N/A"
        [ -z "$BRANCH_COVERAGE" ] && BRANCH_COVERAGE="N/A"
        
        echo "Total Code Coverage: ${TOTAL_COVERAGE}%"
        echo "Line Coverage: ${LINE_COVERAGE}%"
        echo "Branch Coverage: ${BRANCH_COVERAGE}%"
        
        # Fetch vulnerability metrics
        echo ""
        echo "--- Vulnerabilities ---"
        ISSUES_RESPONSE=$(curl -s $AUTH "$SONAR_URL/api/issues/search?componentKeys=$PROJECT_KEY&types=VULNERABILITY&ps=500")
        
        CRITICAL_COUNT=$(echo "$ISSUES_RESPONSE" | jq '[.issues[]? | select(.severity=="CRITICAL")] | length' 2>/dev/null || echo 0)
        MAJOR_COUNT=$(echo "$ISSUES_RESPONSE" | jq '[.issues[]? | select(.severity=="MAJOR")] | length' 2>/dev/null || echo 0)
        HIGH_COUNT=$(echo "$ISSUES_RESPONSE" | jq '[.issues[]? | select(.severity=="HIGH")] | length' 2>/dev/null || echo 0)
        
        echo "Critical Vulnerabilities: $CRITICAL_COUNT"
        echo "Major Vulnerabilities: $MAJOR_COUNT"
        echo "High Vulnerabilities: $HIGH_COUNT"
        
        # Fetch other quality metrics
        echo ""
        echo "--- Code Quality Metrics ---"
        QUALITY_RESPONSE=$(curl -s $AUTH "$SONAR_URL/api/measures/component?metricKeys=bugs,code_smells,duplicated_lines_density,sqale_rating,ncloc,reliability_rating,security_rating&component=$PROJECT_KEY")
        
        BUGS=$(echo "$QUALITY_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="bugs") | .value // empty' 2>/dev/null | head -1)
        CODE_SMELLS=$(echo "$QUALITY_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="code_smells") | .value // empty' 2>/dev/null | head -1)
        DUPLICATION=$(echo "$QUALITY_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="duplicated_lines_density") | .value // empty' 2>/dev/null | head -1)
        MAINTAINABILITY=$(echo "$QUALITY_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="sqale_rating") | .value // empty' 2>/dev/null | head -1)
        NCLOC=$(echo "$QUALITY_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="ncloc") | .value // empty' 2>/dev/null | head -1)
        RELIABILITY=$(echo "$QUALITY_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="reliability_rating") | .value // empty' 2>/dev/null | head -1)
        SECURITY=$(echo "$QUALITY_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="security_rating") | .value // empty' 2>/dev/null | head -1)
        
        [ -z "$BUGS" ] && BUGS="0"
        [ -z "$CODE_SMELLS" ] && CODE_SMELLS="0"
        [ -z "$DUPLICATION" ] && DUPLICATION="0"
        [ -z "$MAINTAINABILITY" ] && MAINTAINABILITY="N/A"
        [ -z "$NCLOC" ] && NCLOC="0"
        [ -z "$RELIABILITY" ] && RELIABILITY="N/A"
        [ -z "$SECURITY" ] && SECURITY="N/A"
        
        echo "Bugs: $BUGS"
        echo "Code Smells: $CODE_SMELLS"
        echo "Duplicated Lines Density (%): $DUPLICATION"
        echo "Maintainability Rating: $MAINTAINABILITY"
        echo "Total Lines of Code: $NCLOC"
        echo "Reliability Rating: $RELIABILITY"
        echo "Security Rating: $SECURITY"
        
        echo ""
        echo "====================================================="
