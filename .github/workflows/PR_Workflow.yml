# This workflow builds a Java project with Maven, runs SonarQube analysis, and generates code quality metrics.
# It is triggered on push to master, pull requests to master, and manual workflow dispatch.
# The workflow includes Maven build, SonarQube scan, and metrics collection/reporting.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven


name: PR_Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:  # Enables manual trigger

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:10.6.0-community
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl --silent --fail http://localhost:9000 || exit 1"
          --health-interval=30s
          --health-timeout=30s
          --health-retries=10
          --memory=4g
          --cpus=2

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Wait for SonarQube to be ready
      run: |
        echo "Waiting for SonarQube to start..."
        for i in {1..32}; do
          if curl --silent --fail http://localhost:9000/api/system/status; then
            echo "SonarQube is up and running!"
            break
          fi
          echo "Waiting for SonarQube..."
          sleep 10
        done
        echo "SonarQube did not become healthy, continuing anyway."

    - name: SonarQube Scan
      run: |
        mvn sonar:sonar \
          -Dsonar.projectKey=com.sgd:e-commerce \
          -Dsonar.host.url=http://localhost:9000 \
          -Dsonar.login=admin \
          -Dsonar.password=admin

    - name: Fetch SonarQube Metrics
      run: |
        echo "========== SonarQube Code Quality Metrics =========="
        
        # API endpoint and credentials
        SONAR_URL="http://localhost:9000"
        PROJECT_KEY="com.sgd%3Ae-commerce"
        AUTH="-u admin:admin"
        
        # Wait for SonarQube to process the analysis
        echo "Waiting for SonarQube to process the analysis..."
        sleep 5
        
        # Fetch coverage metrics
        echo ""
        echo "--- Code Coverage ---"
        COVERAGE_RESPONSE=$(curl -s $AUTH "$SONAR_URL/api/measures/component?metricKeys=coverage,new_code_coverage&component=$PROJECT_KEY")
        
        if [ -z "$COVERAGE_RESPONSE" ] || [ "$COVERAGE_RESPONSE" == "null" ]; then
          echo "Warning: No coverage data available yet"
          TOTAL_COVERAGE="N/A"
          NEW_CODE_COVERAGE="N/A"
        else
          TOTAL_COVERAGE=$(echo "$COVERAGE_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="coverage") | .value // empty' | head -1)
          NEW_CODE_COVERAGE=$(echo "$COVERAGE_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="new_code_coverage") | .value // empty' | head -1)
          [ -z "$TOTAL_COVERAGE" ] && TOTAL_COVERAGE="N/A"
          [ -z "$NEW_CODE_COVERAGE" ] && NEW_CODE_COVERAGE="N/A"
        fi
        
        echo "Total Code Coverage: ${TOTAL_COVERAGE}%"
        echo "New Code Coverage: ${NEW_CODE_COVERAGE}%"
        
        # Fetch vulnerability metrics
        echo ""
        echo "--- Vulnerabilities ---"
        ISSUES_RESPONSE=$(curl -s $AUTH "$SONAR_URL/api/issues/search?componentKeys=$PROJECT_KEY&types=VULNERABILITY&ps=500")
        
        if [ -z "$ISSUES_RESPONSE" ] || [ "$ISSUES_RESPONSE" == "null" ]; then
          echo "Warning: No vulnerability data available"
          CRITICAL_COUNT=0
          MAJOR_COUNT=0
          HIGH_COUNT=0
        else
          CRITICAL_COUNT=$(echo "$ISSUES_RESPONSE" | jq '[.issues[]? | select(.severity=="CRITICAL")] | length' 2>/dev/null || echo 0)
          MAJOR_COUNT=$(echo "$ISSUES_RESPONSE" | jq '[.issues[]? | select(.severity=="MAJOR")] | length' 2>/dev/null || echo 0)
          HIGH_COUNT=$(echo "$ISSUES_RESPONSE" | jq '[.issues[]? | select(.severity=="HIGH")] | length' 2>/dev/null || echo 0)
        fi
        
        echo "Critical Vulnerabilities: $CRITICAL_COUNT"
        echo "Major Vulnerabilities: $MAJOR_COUNT"
        echo "High Vulnerabilities: $HIGH_COUNT"
        
        # Fetch other quality metrics
        echo ""
        echo "--- Other Quality Metrics ---"
        QUALITY_RESPONSE=$(curl -s $AUTH "$SONAR_URL/api/measures/component?metricKeys=bugs,code_smells,duplicated_lines_density,sqale_rating&component=$PROJECT_KEY")
        
        if [ -z "$QUALITY_RESPONSE" ] || [ "$QUALITY_RESPONSE" == "null" ]; then
          echo "Warning: No quality metrics available yet"
          BUGS="N/A"
          CODE_SMELLS="N/A"
          DUPLICATION="N/A"
          MAINTAINABILITY="N/A"
        else
          BUGS=$(echo "$QUALITY_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="bugs") | .value // empty' | head -1)
          CODE_SMELLS=$(echo "$QUALITY_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="code_smells") | .value // empty' | head -1)
          DUPLICATION=$(echo "$QUALITY_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="duplicated_lines_density") | .value // empty' | head -1)
          MAINTAINABILITY=$(echo "$QUALITY_RESPONSE" | jq -r '.component.measures[]? | select(.metric=="sqale_rating") | .value // empty' | head -1)
          [ -z "$BUGS" ] && BUGS="N/A"
          [ -z "$CODE_SMELLS" ] && CODE_SMELLS="N/A"
          [ -z "$DUPLICATION" ] && DUPLICATION="N/A"
          [ -z "$MAINTAINABILITY" ] && MAINTAINABILITY="N/A"
        fi
        
        echo "Bugs: $BUGS"
        echo "Code Smells: $CODE_SMELLS"
        echo "Duplicated Lines (%): $DUPLICATION%"
        echo "Maintainability Rating: $MAINTAINABILITY"
        
        echo ""
        echo "====================================================="
